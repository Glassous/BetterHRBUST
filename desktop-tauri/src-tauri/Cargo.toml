[package]
name = "betterhrbust-desktop"
# 声明默认运行目标：新增 BetterHRBUSTCLI 后 crate 有两个二进制，
# tauri CLI 需要据此确定"主程序"（GUI）而不是命令行入口
default-run = "betterhrbust-desktop"
version = "1.3.0"
description = "BetterHRBUST - 哈理工教务在线 Windows 桌面客户端（Tauri 封装 + Rust 内置本地反向代理）"
authors = ["BetterHRBUST"]
license = "MIT"
edition = "2021"
rust-version = "1.90"

[lib]
name = "betterhrbust_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# GUI 主程序（入口 src/main.rs，包名与 tauri.conf.json 的 mainBinaryName 对齐）
# 命令行程序：独立 console 子系统二进制，才不会在 cmd / PowerShell 中
# 出现"不被等待、输出与提示符交错、中文乱码"的问题（见 src/cli/mod.rs）
[[bin]]
name = "BetterHRBUSTCLI"
path = "src/bin/cli.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "macros", "sync"] }
http = "1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client", "client-legacy", "http1", "server", "server-auto", "tokio"] }
http-body = "1"
http-body-util = "0.1"
# Stream trait（http-body-util 的 StreamBody 需要；已在依赖图中，无额外体积）
futures-core = "0.3"
rust-embed = { version = "8", features = ["compression"] }
mime_guess = "2"
percent-encoding = "2"
# 仅用于 /__app/storage 键值持久化的 JSON 编解码（tauri 已传递依赖，无额外体积）
serde_json = "1"
# 命令行数据模型（缓存记录 → 强类型视图）与 /__app/cli 返回体序列化；
# serde 本就是 serde_json 的直接依赖，不引入新编译产物
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
tempfile = "3"

# 体积优先：LTO + 单编译单元 + 体积优化 + 符号剥离
# （体积与内存目标：安装包 <= 10MB、Rust 主进程 RSS <= 25MB）
[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
strip = true

[profile.release.package."*"]
opt-level = "s"
