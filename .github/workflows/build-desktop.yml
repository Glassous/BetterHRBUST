name: Build Desktop (Tauri)

# 桌面端唯一的打包入口：Windows 与 Linux 在同一次运行里构建，最后合并为
# 一个带版本号的「全平台整合包」，Actions 里只下载一个产物即可拿全部安装包。
#   windows job → 安装版 exe + 免安装版 zip
#   linux job   → deb + rpm
#   package job → BetterHRBUST-<version>-desktop-all.zip（解压后含上述四类产物）
# Rust 集成测试作为门禁；Release 由 release-desktop.yml 复用本工作流后自动上传。
on:
  push:
    branches: [main]
    paths:
      - 'desktop-tauri/**'
      - 'web/**'
      - 'shared/**'
      # 终端界面（tui/）会被编进 Windows 安装包，改动它同样要重新打包
      - 'tui/**'
      # shared/parity 是跨端算法一致性向量，只被测试读取，不参与桌面端构建；
      # 不加这条排除，任何一次向量调整都会白跑一遍 Windows + Linux 构建。
      - '!shared/parity/**'
      - '.github/workflows/build-desktop.yml'
      - '.github/workflows/release-desktop.yml'
  pull_request:
    paths:
      - 'desktop-tauri/**'
      - 'web/**'
      - 'shared/**'
      # 终端界面（tui/）会被编进 Windows 安装包，改动它同样要重新打包
      - 'tui/**'
      # shared/parity 是跨端算法一致性向量，只被测试读取，不参与桌面端构建；
      # 不加这条排除，任何一次向量调整都会白跑一遍 Windows + Linux 构建。
      - '!shared/parity/**'
      - '.github/workflows/build-desktop.yml'
      - '.github/workflows/release-desktop.yml'
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  # package job 用 gh run download 取同一 run 内另外两个 job 的产物，
  # 换成 actions/download-artifact 就要多钉一个第三方 action 的 SHA，这里直接用官方 CLI。
  actions: read

concurrency:
  group: build-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            desktop-tauri/package-lock.json

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable

      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: desktop-tauri/src-tauri

      - name: Build web
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Install Tauri CLI
        working-directory: desktop-tauri
        run: npm ci

      # 终端界面是独立的 Go 程序（tui/），由 scripts/build-tui.mjs 编译到
      # desktop-tauri/binaries/，再由 src-tauri/tauri.windows.conf.json 的
      # bundle.resources 复制进安装目录。
      # 必须早于任何 cargo 调用：tauri-build 在编译期就会校验 bundle.resources，
      # 缺文件时连 cargo test 都会以「resource path ... doesn't exist」失败。
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tui/go.mod
          cache-dependency-path: tui/go.sum

      - name: Build TUI
        working-directory: desktop-tauri
        run: node scripts/build-tui.mjs

      # 本地服务层门禁：静态托管/SPA/穿越防护/反代规则(mock 上游)/断连语义/端口顺延
      - name: Rust tests
        run: cargo test --manifest-path desktop-tauri/src-tauri/Cargo.toml

      # 注意：tauri build 会构建 crate 里的全部 bin，因此安装包内自动包含
      # BetterHRBUSTCLI.exe（命令行），无需额外的 sidecar 步骤
      - name: Build bundles
        working-directory: desktop-tauri
        run: npx tauri build

      - name: Portable zip
        working-directory: desktop-tauri
        run: node scripts/make-portable.mjs

      # 产物已统一命名(见 desktop-tauri/scripts/make-portable.mjs)，由 package job 汇总:
      #   BetterHRBUST-<version>-windows-setup.exe     安装版
      #   BetterHRBUST-<version>-windows-portable.zip  便携版(解压即用)
      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: betterhrbust-desktop-windows
          path: desktop-tauri/release/*
          if-no-files-found: error

  # Linux 门禁与打包：与 Windows job 同序、同版本钉；deb/rpm 由 tauri 纯 Rust 打包器产出。
  # glibc 基线 = ubuntu-22.04（2.35），覆盖 Debian 12+ / Ubuntu 22.04+ / RHEL 9+ / Fedora 37+ / Arch。
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            desktop-tauri/package-lock.json

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable

      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: desktop-tauri/src-tauri

      # Tauri v2 官方 Linux 依赖清单（WebKit 2.4.1 系 + AppIndicator）
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Build web
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Install Tauri CLI
        working-directory: desktop-tauri
        run: npm ci

      # 本地服务层门禁：静态托管/SPA/穿越防护/反代规则(mock 上游)/断连语义/端口顺延
      - name: Rust tests
        run: cargo test --manifest-path desktop-tauri/src-tauri/Cargo.toml

      # 与 Windows 相同：tauri build 构建全部 bin，deb/rpm 自动包含 BetterHRBUSTCLI
      - name: Build bundles
        working-directory: desktop-tauri
        run: npx tauri build

      - name: Collect packages
        working-directory: desktop-tauri
        run: node scripts/collect-linux.mjs

      # 包体自检：命令行必须进包（回归防线，防止 bundler 行为变化悄悄丢掉 CLI）
      - name: Verify packages
        run: |
          dpkg-deb -c desktop-tauri/release/BetterHRBUST-*-linux-amd64.deb | grep -E 'usr/bin/BetterHRBUSTCLI'
          sudo apt-get install -y rpm
          rpm -qlp desktop-tauri/release/BetterHRBUST-*-linux-x86_64.rpm | grep -E 'usr/bin/BetterHRBUSTCLI'

      # 产物已统一命名(见 desktop-tauri/scripts/collect-linux.mjs)，由 package job 汇总:
      #   BetterHRBUST-<version>-linux-amd64.deb    Debian/Ubuntu 安装包
      #   BetterHRBUST-<version>-linux-x86_64.rpm   RHEL/Fedora/openSUSE 安装包
      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: betterhrbust-desktop-linux
          path: desktop-tauri/release/*
          if-no-files-found: error

  # 汇总：把两个平台的产物合并成一个带版本号的大压缩包。
  # 下载地址（Actions 产物、Release 资产）从此只有一个入口，不再分平台各点一次。
  package:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install zip
        run: sudo apt-get update && sudo apt-get install -y zip unzip

      # 同一 run 内先完成的两个 job 的产物：gh 已随 runner 预装并带 GITHUB_TOKEN
      - name: Download platform artifacts
        run: |
          gh run download "$GITHUB_RUN_ID" -n betterhrbust-desktop-windows -D staging/windows
          gh run download "$GITHUB_RUN_ID" -n betterhrbust-desktop-linux -D staging/linux

      # 产出 release/BetterHRBUST-<version>-desktop-all.zip，并把四份单文件产物
      # 一并归拢到 release/：本 job 的 artifact 与 Release 资产都只需上传这一个目录
      - name: Bundle all platforms
        working-directory: desktop-tauri
        run: node scripts/make-all-platforms.mjs --windows ../staging/windows --linux ../staging/linux

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: betterhrbust-desktop-all
          path: desktop-tauri/release/*
          if-no-files-found: error
