name: Build Desktop (Tauri)

# 推送 desktop-tauri/ 或 web/ 相关改动到 main 时自动构建 Windows 桌面端,
# Rust 集成测试作为门禁;构建产物上传为 workflow artifact,可从 Actions 页面下载。
# Release 由维护者手动创建并上传产物(桌面端更新检查读取 GitHub Release 的 latest)。
on:
  push:
    branches: [main]
    paths:
      - 'desktop-tauri/**'
      - 'web/**'
      - 'shared/**'
      - '.github/workflows/build-desktop.yml'
  pull_request:
    paths:
      - 'desktop-tauri/**'
      - 'web/**'
      - 'shared/**'
      - '.github/workflows/build-desktop.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-desktop
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            desktop-tauri/package-lock.json

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable

      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: desktop-tauri/src-tauri

      - name: Build web
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Install Tauri CLI
        working-directory: desktop-tauri
        run: npm ci

      # 本地服务层门禁：静态托管/SPA/穿越防护/反代规则(mock 上游)/断连语义/端口顺延
      - name: Rust tests
        run: cargo test --manifest-path desktop-tauri/src-tauri/Cargo.toml

      # 注意：tauri build 会构建 crate 里的全部 bin，因此安装包内自动包含
      # BetterHRBUSTCLI.exe（命令行），无需额外的 sidecar 步骤
      - name: Build bundles
        working-directory: desktop-tauri
        run: npx tauri build

      - name: Portable zip
        working-directory: desktop-tauri
        run: node scripts/make-portable.mjs

      # 产物已统一命名(见 desktop-tauri/scripts/make-portable.mjs),发布 Release 时直接上传:
      #   BetterHRBUST-<version>-windows-setup.exe     安装版
      #   BetterHRBUST-<version>-windows-portable.zip  便携版(解压即用)
      # Android 安装包在本地打包后重命名为 BetterHRBUST-<version>-android.apk 一并上传
      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: betterhrbust-desktop-windows
          path: desktop-tauri/release/*
          if-no-files-found: error
