name: Build TUI

# 终端界面三件套：格式/静态检查/测试，加五目标交叉编译。
# 只在改动 tui/ 或共享数据时触发，避免无关 PR 也跑一遍。

on:
  push:
    branches: [main]
    paths:
      - 'tui/**'
      - 'shared/parity/**'
      - 'shared/school-calendar.json'
      - '.github/workflows/build-tui.yml'
  pull_request:
    paths:
      - 'tui/**'
      - 'shared/parity/**'
      - 'shared/school-calendar.json'
      - '.github/workflows/build-tui.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: 检查与测试
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tui
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 安装 Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tui/go.mod
          cache-dependency-path: tui/go.sum

      - name: 校验格式
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "以下文件未格式化，请执行 gofmt -w . ："
            echo "$unformatted"
            exit 1
          fi

      - name: 静态检查
        run: go vet ./...

      - name: 单元测试与一致性向量
        run: go test ./... -count=1

  build:
    name: 构建 ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: windows
            goarch: amd64
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 安装 Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tui/go.mod
          cache-dependency-path: tui/go.sum

      - name: 计算版本号
        id: version
        working-directory: tui
        run: echo "value=$(git describe --tags --always --dirty 2>/dev/null || echo dev)" >> "$GITHUB_OUTPUT"

      - name: 交叉编译
        working-directory: tui
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          out="BetterHRBUST-${{ steps.version.outputs.value }}-tui-${GOOS}-${GOARCH}"
          if [ "$GOOS" = "windows" ]; then out="${out}.exe"; fi
          go build -trimpath \
            -ldflags "-s -w -X github.com/Glassous/BetterHRBUST/tui/internal/version.Version=${{ steps.version.outputs.value }}" \
            -o "$out" ./cmd/betterhrbust-tui
          echo "已生成 $out"
          ls -lh "$out"

      - name: 上传产物
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tui-${{ matrix.goos }}-${{ matrix.goarch }}
          path: tui/BetterHRBUST-*-tui-*
          if-no-files-found: error
          retention-days: 14
