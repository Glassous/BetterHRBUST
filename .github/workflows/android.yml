name: Android 验证与构建

on:
  pull_request:
    paths: ['android/**', 'shared/school-calendar.json', 'tools/generate-school-calendar.mjs', '.github/workflows/android.yml']
  push:
    paths: ['android/**', 'shared/school-calendar.json', 'tools/generate-school-calendar.mjs', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # 校历共享数据（shared/）被 Android 与 web 两端生成/消费，改动需校验一致性
      - name: 检查校历共享数据
        run: node tools/generate-school-calendar.mjs --check
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: 安装编译平台
        run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0'
      # 正式签名密钥：在仓库 Settings → Secrets and variables → Actions 中配置（见 README「Android 客户端」）。
      # 未配置时 Release 产物为未签名 APK，仅用于验证，不能对外分发。
      # 四个 secret 只注入到实际消费的步骤 env，最小化暴露面（其余步骤读不到）。
      - name: 准备正式签名密钥
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
      - name: 提示未配置签名密钥
        if: env.ANDROID_KEYSTORE_BASE64 == ''
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "::warning::未配置 ANDROID_KEYSTORE_BASE64，Release 产物将保持未签名，不能用于正式分发。"
      - name: 测试、Lint 与 APK 构建
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest lintDebug assembleDebug assembleRelease --stacktrace
      # 产物命名见 android/app/build.gradle.kts 的 androidComponents 块：
      #   release → BetterHRBUST-<version>-android.apk / debug → BetterHRBUST-<version>-android-debug.apk
      - name: 校验 Release 包签名
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          APK=$(ls android/app/build/outputs/apk/release/*.apk 2>/dev/null | head -1)
          if [ -z "$APK" ]; then
            echo "::error::未找到 Release 包（预期 android/app/build/outputs/apk/release/BetterHRBUST-*-android.apk），请检查构建与 naming 配置。"
            exit 1
          fi
          APKSIGNER=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/*/apksigner | tail -1)
          "$APKSIGNER" verify --print-certs "$APK"
      - name: 核对 APK 产物命名
        shell: bash
        run: |
          RELEASE=$(ls android/app/build/outputs/apk/release/*.apk 2>/dev/null | head -1)
          DEBUG=$(ls android/app/build/outputs/apk/debug/*.apk 2>/dev/null | head -1)
          echo "release: ${RELEASE:-<缺失>}"
          echo "debug: ${DEBUG:-<缺失>}"
          [[ "$RELEASE" == *"BetterHRBUST-"*"-android.apk" ]] || { echo "::error::Release 产物命名不符合 BetterHRBUST-<version>-android.apk：$RELEASE"; exit 1; }
          [[ "$DEBUG" == *"BetterHRBUST-"*"-android-debug.apk" ]] || { echo "::error::Debug 产物命名不符合 BetterHRBUST-<version>-android-debug.apk：$DEBUG"; exit 1; }
      - name: 保存验证报告与构建产物
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: BetterHRBUST-Android
          path: |
            android/app/build/reports/
            android/app/build/outputs/apk/
          if-no-files-found: warn
