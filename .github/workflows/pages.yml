name: 发布 GitHub Pages

on:
  push:
    branches: [main]
    # 落地页依赖 web 组件与共享校历资源（shared/**），树外依赖变化同样触发重建
    paths: ['landing/**', 'web/src/**', 'shared/**', '.github/workflows/pages.yml']
  pull_request:
    paths: ['landing/**', 'web/src/**', 'shared/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: landing/package-lock.json
      - name: 构建发布页
        working-directory: landing
        run: |
          npm ci && npm run build && npm run test:build
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: landing/dist
  deploy:
    if: github.repository == 'Glassous/BetterHRBUST' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        id: deployment
