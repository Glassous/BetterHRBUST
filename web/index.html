<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <script>
      try {
        var t = localStorage.getItem('better_hrbust_theme') || 'system';
        var m = document.querySelector('meta[name="color-scheme"]');
        if (m) m.content = t === 'light' || t === 'dark' ? t : 'light dark';
        var d = t === 'dark' || (t === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', d);
      } catch (e) {}
    </script>
    <link rel="icon" type="image/png" href="/BetterHRBUST.png" />
    <title>BetterHRBUST</title>
  </head>
  <body class="bg-[#f4f6f9] text-[#131820] dark:bg-[#06080b] dark:text-[#f1f5fb] min-h-screen transition-colors duration-200 antialiased selection:bg-[var(--accent-soft)] selection:text-[var(--ink-primary)]">
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
